<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home.html</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #000;
        }

        .phone-frame {
            width: 100%;
            height: 100%;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 8px 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .browser-header {
            background-color: #000000;
            color: #ffffff;
            padding: 10px 16px 14px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 16px;
        }

        .browser-header span {
            cursor: pointer;
            font-size: 18px;
        }

        .content-area {
            flex: 1;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            position: relative;
        }

        .views-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .view-section {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .view-section.active {
            display: flex;
        }

        .card {
            background-color: #ffffff;
            padding: 20px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        .card-title {
            font-size: 11px;
            font-weight: 600;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 24px;
            font-weight: bold;
            color: #111;
        }

        .button-container {
            display: flex;
            gap: 6px;
            width: 100%;
            padding-bottom: 20px;
        }

        .action-btn {
            flex: 1;
            background-color: #555555;
            color: white;
            border: none;
            padding: 12px 2px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.2s;
            display: inline-block;
        }

        .action-btn:hover {
            background-color: #444444;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            margin-top: 10px;
        }

        .form-group label {
            font-size: 12px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .submit-btn {
            margin-top: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        .receipt-item {
            font-size: 13px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="phone-frame">
        <div class="status-bar">
        </div>
        <div class="browser-header">
        </div>

        <div class="content-area">
            <div class="views-container">
                <div class="view-section active">
                    <div class="card">
                        <div class="card-title">CURRENT BALANCE</div>
                        <div class="card-value">₱{{ "%.2f"|format(balance) }}</div>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <a href="{{ url_for('bank', operation='deposit') }}" class="action-btn">Deposit</a>
                <a href="{{ url_for('bank', operation='withdraw') }}" class="action-btn">Withdraw</a>
                <a href="{{ url_for('bank', operation='transfer') }}" class="action-btn">Transfer</a>
                <a href="{{ url_for('bank', operation='receipts') }}" class="action-btn">Receipts</a>
                <a href="{{ url_for('bank', operation='account') }}" class="action-btn">Account</a>
            </div>
        </div>
    </div>
</body>
</html>
