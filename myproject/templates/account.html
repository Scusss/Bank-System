<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .account-container {
            width: 360px;
            max-width: calc(100% - 32px);
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin: 0 0 25px;
        }

        .balance-container {
            text-align: center;
            background: #f8f9fa;
            padding: 20px 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .balance-label {
            margin: 0;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            margin: 8px 0 0;
            font-size: 28px;
            font-weight: bold;
            color: #198754;
            overflow-wrap: anywhere;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: bold;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .back-button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #e9ecef;
            color: #333;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-size: 15px;
        }

        .back-button:hover {
            background: #dee2e6;
        }
    </style>
</head>

<body>
    <main class="account-container">
        <h2>My Account</h2>

        <div class="balance-container">
            <p class="balance-label">Available Balance</p>
            <p class="balance-amount">
                ₱{{ "%.2f"|format(balance|float) }}
            </p>
        </div>

        <div class="detail-row">
            <span class="detail-label">First Name</span>
            <span class="detail-value">{{ fname }}</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Last Name</span>
            <span class="detail-value">{{ lname }}</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Email</span>
            <span class="detail-value">{{ email }}</span>
        </div>

        <a href="{{ url_for('pages.home') }}" class="back-button">
            Back to Home
        </a>
    </main>
</body>
</html>
