
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        form {
            width: 300px;
            max-width: calc(100% - 60px);
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        h2 {
            text-align: center;
            margin: 0;
        }

        input, button, .back-button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #198754;
            color: white;
            cursor: pointer;
        }

        .back-button {
            background: #e9ecef;
            color: #333;
            text-align: center;
            text-decoration: none;
        }

        .flash-message.error {
            color: #842029;
            background: #f8d7da;
            padding: 10px;
            border-radius: 6px;
        }

        .flash-message.success {
            color: #0f5132;
            background: #d1e7dd;
            padding: 10px;
            border-radius: 6px;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body>
    <form action="{{ url_for('transactions.transaction', operation='transfer') }}"
          method="POST">

        <h2>Transfer Money</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <label for="recipient_id">Recipient Account ID</label>
        <input type="number" id="recipient_id" name="recipient_id"
               min="1" step="1" placeholder="Enter account ID" required>

        <label for="amount">Amount to transfer</label>
        <input 
          type="number" 
          id="amount" 
          name="amount"      
          min="0.01" 
          step="0.01" 
          placeholder="Enter amount"
          autocomplete="off"
          required>

        <button type="submit">Transfer</button>

        <a href="{{ url_for('pages.home') }}" class="back-button">
            Go back to home
        </a>
    </form>
</body>
</html>
